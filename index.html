<!-- index.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeu d'Evasion : Histoires d'atmosphères</title>
    <link rel="stylesheet" href="terre-precoce/styles/transitions.css">
    <link rel="stylesheet" href="terre-precoce/styles/style.css">
    <link rel="stylesheet" href="terre-precoce/styles/style-collect.css">
    <link rel="stylesheet" href="terre-precoce/styles/style-phasediag.css">

</head>
<div id="transition-container" style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10000;
    pointer-events: none;
    display: none;
"></div>
<canvas id="pixel-transition"></canvas>
<body>
    <!-- Bouton pour activer le plein écran (icône injectée par script.js) -->
    <button id="fullscreen-button"></button>
    <!-- Scène à ratio fixe (letterboxing) : garantit que le positionnement
         en % de tous les éléments reste aligné avec les images de fond,
         quel que soit le ratio de l'écran (mobile compris). -->
    <div id="game-stage">
        <!-- Conteneur principal où les écrans seront chargés -->
        <div id="game-container"></div>
    </div>
    <script src="terre-precoce/scripts/screens.js"></script>
    <script src="terre-precoce/scripts/qcm-answers.js"></script>
    <script src="terre-precoce/scripts/script-digit.js"></script>
    <script src="terre-precoce/scripts/script-typewriter.js"></script>
    <script src="terre-precoce/scripts/script-qcm.js"></script>
    <script src="terre-precoce/scripts/script-dice.js"></script>
    <script src="terre-precoce/scripts/script-minisimclim.js"></script>
    <script src="terre-precoce/scripts/script-drawers.js"></script>
    <script src="terre-precoce/scripts/script-modale.js"></script>
    <script src="terre-precoce/scripts/script.js"></script>
    <script src="terre-precoce/scripts/script-collect.js"></script>
    <script src="terre-precoce/scripts/script-phasediagram.js"></script>
</body>
</html>
